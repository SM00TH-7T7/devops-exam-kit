apiVersion: v1
kind: Namespace
metadata:
  name: exam-set-6
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-config
  namespace: exam-set-6
data:
  APP_MESSAGE: Hello from Set 6 ConfigMap!
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  namespace: exam-set-6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask
        image: EXAM_IMAGE
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - configMapRef:
            name: flask-config
        env:
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: flask-secret
              key: API_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: flask
  namespace: exam-set-6
spec:
  selector:
    app: flask
  ports:
  - port: 80
    targetPort: 5000
